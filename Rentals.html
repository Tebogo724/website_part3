  <h1>Apartments for Rent</h1>
    <h2>Find Your Ideal Home</h2>
    <div class="property-list">

    <div class="property-card">

       <div class="property-gallery">

 <img id="featured-image"
     src="_images/apartment_building.jpg"

     onclick="openLightbox()">

    <div class="gallery-thumbnails">
<img src="_images/apartment_building.jpg"
     alt="Brand new apartments"
     onclick="openLightbox('building')">

<img src="_images/apartments_two.jpg"
     alt="Two-bedroom apartments"
     onclick="openLightbox('two-bedroom')">

<img src="_images/apartments_three.jpg"
     alt="Single-bedroom apartments"
     onclick="openLightbox('single-bedroom')">

<section class="map-section">

    <div class="property-viewer">

        <div class="viewer-controls">

    <button type="button" onclick="previousProperty()">Previous</button>

    <button type="button" onclick="closeLightbox()">Close</button>

    <button type="button" onclick="nextProperty()">Next</button>

</div>

        <img id="lightbox-image" src="" alt="">

        <div class="property-details">
            <h2 id="property-title"></h2>
            <p id="property-location"></p>
